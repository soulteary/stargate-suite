<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1a1a1a"/>
  <!-- mane -->
  <rect x="2" y="3" width="2" height="2" fill="#c47a12"/>
  <rect x="12" y="3" width="2" height="2" fill="#c47a12"/>
  <rect x="1" y="5" width="2" height="2" fill="#d4891a"/>
  <rect x="13" y="5" width="2" height="2" fill="#d4891a"/>
  <rect x="2" y="7" width="2" height="2" fill="#c47a12"/>
  <rect x="12" y="7" width="2" height="2" fill="#c47a12"/>
  <!-- face -->
  <rect x="4" y="4" width="8" height="7" fill="#e8a838"/>
  <rect x="5" y="3" width="6" height="1" fill="#e8a838"/>
  <rect x="5" y="11" width="6" height="1" fill="#e8a838"/>
  <!-- ears -->
  <rect x="4" y="2" width="2" height="2" fill="#e8a838"/>
  <rect x="10" y="2" width="2" height="2" fill="#e8a838"/>
  <rect x="5" y="2" width="1" height="1" fill="#f0c56a"/>
