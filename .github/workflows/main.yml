name: CI (main)

# main tier — full validation on pushes to the integration branches. Heavier
# than the PR tier: complete E2E, container build, vulnerability scan, and the
# three-OS binary build matrix. Signing / SBOM / provenance live in release.yml.
on:
  push:
    branches: [ main, master, develop ]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  test:
    name: Lint, unit tests, config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download dependencies
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      - name: Config validation
        run: go run ./cmd/suite validate

      - name: Release version contract
        run: ./scripts/semver-prerelease.sh --test

      - name: Run tests (exclude e2e, with race + coverage)
        run: |
          pkgs=$(go list ./... | grep -v '/e2e$' || true)
          if [ -n "$pkgs" ]; then
            go test -race -coverprofile=coverage.out -covermode=atomic $pkgs
          else
            touch coverage.out
          fi

      - name: Display coverage summary
        if: success()
        run: go tool cover -func=coverage.out 2>/dev/null || true

      - name: Enforce coverage floor
        env:
          COVERAGE_MINIMUM: "30.0"
        run: ./scripts/check-coverage.sh coverage.out

  e2e:
    name: Full E2E
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    env:
      COMPOSE_FILE: ${{ github.workspace }}/build/image/docker-compose.yml
      ENVIRONMENT: test
      TEST_WAIT_TIMEOUT: 180
      HERALD_COMPOSE_DIR: ${{ github.workspace }}
      HERALD_TEST_MODE: "true"
      HERALD_TEST_LISTENER_ADDR: 127.0.0.1:8092
      HERALD_TEST_API_KEY: test-herald-test-code-key
      HERALD_REDIS_PASSWORD: test-herald-redis-password
      WARDEN_REDIS_PASSWORD: test-warden-redis-password
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download dependencies
        run: go mod download

      - name: Generate test-profile compose (native CLI)
        run: make gen-test

      - name: Prepare Warden data for E2E
        run: cp fixtures/warden/data.json build/image/data.json

      - name: Start services
        run: docker compose -f "$COMPOSE_FILE" up -d

      - name: Wait for services to be ready
        run: |
          start=$(date +%s)
          while true; do
            all_ok=true
            for endpoint in "8080/healthz" "8081/healthcheck" "8082/healthz"; do
              port="${endpoint%%/*}"
              path="${endpoint#*/}"
              if ! curl -sf --connect-timeout 3 "http://127.0.0.1:$port/$path" > /dev/null 2>&1; then
                all_ok=false
                break
              fi
            done
            if [ "$all_ok" = true ]; then
              echo "All services ready."
              break
            fi
            now=$(date +%s)
            elapsed=$(( now - start ))
            if [ "$elapsed" -ge "${TEST_WAIT_TIMEOUT:-180}" ]; then
              echo "Services did not become ready within ${TEST_WAIT_TIMEOUT}s."
              docker compose -f "$COMPOSE_FILE" ps -a
              docker compose -f "$COMPOSE_FILE" logs --tail=200
              exit 1
            fi
            echo "  waiting... (${elapsed}s)"
            sleep 2
          done

      - name: Run full E2E tests
        run: go test -race -timeout 20m ./e2e/...

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" ps -a
          docker compose -f "$COMPOSE_FILE" logs --tail=300

  docker-build:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Get version information
        id: version
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: stargate-suite:test
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container runtime
        run: |
          RUN_DOCKER_SMOKE=1 DOCKER_SMOKE_IMAGE=stargate-suite:test \
            go test -timeout 3m ./cmd/suite -run '^TestContainerServe'

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stargate-suite:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build:
    name: Build check (matrix)
    runs-on: ${{ matrix.os }}
    needs: [test]
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download dependencies
        run: go mod download

      - name: Get version information
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build project
        shell: bash
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o stargate-suite${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/suite

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stargate-suite-binary-${{ matrix.os }}
          path: stargate-suite${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 5
