name: CI (PR)

# PR tier — fast feedback (target 5-8 min). Runs on pull requests only; pushes
# to main are validated by the heavier `main.yml` tier. Documentation-only PRs
# skip container build and E2E via the `changes` path filter below.
on:
  pull_request:
    branches: [ main, master, develop ]

# Cancel superseded runs for the same PR so we don't burn minutes on stale SHAs.
concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  # Detect which parts of the tree changed so heavy jobs (smoke E2E) run only
  # when component manifest / canonical compose / E2E / auth-relevant code moves.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Path filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'config/**'
              - 'compose/**'
              - 'Dockerfile'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/**'
            e2e:
              - 'e2e/**'
              - 'config/components.yaml'
              - 'config/components.lock.yaml'
              - 'compose/**'
              - 'fixtures/**'
              - 'internal/composegen/**'
              - 'internal/policy/**'
              - 'internal/contract/**'
              - 'Dockerfile'
            docs_only:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'

  # Static analysis + non-e2e unit tests + config/compose sanity. Always runs
  # (even for docs-only PRs it is cheap and guards accidental code edits).
  test:
    name: Lint, unit tests, config
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download dependencies
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Config validation
        run: go run ./cmd/suite validate

      - name: Generate compose (native CLI, no Web server)
        run: make gen

      - name: docker compose config (syntax)
        env:
          HERALD_REDIS_PASSWORD: ci-herald-redis-password
          WARDEN_REDIS_PASSWORD: ci-warden-redis-password
        run: docker compose -f build/image/docker-compose.yml config >/dev/null

      - name: Run tests (exclude e2e, with race + coverage)
        run: |
          pkgs=$(go list ./... | grep -v '/e2e$' || true)
          if [ -n "$pkgs" ]; then
            go test -race -coverprofile=coverage.out -covermode=atomic $pkgs
          else
            echo "No non-e2e packages to test"
            touch coverage.out
          fi

      - name: Display coverage summary
        if: success()
        run: go tool cover -func=coverage.out 2>/dev/null || true

  # Smoke E2E — only when E2E-relevant paths changed. Docs-only or pure Web-UI
  # PRs skip this to keep PR feedback fast and cheap.
  smoke-e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 20
    env:
      COMPOSE_FILE: ${{ github.workspace }}/build/image/docker-compose.yml
      TEST_WAIT_TIMEOUT: 180
      HERALD_COMPOSE_DIR: ${{ github.workspace }}
      HERALD_TEST_LISTENER_ADDR: 127.0.0.1:8092
      HERALD_TEST_API_KEY: test-herald-test-code-key
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download dependencies
        run: go mod download

      - name: Generate compose (native CLI)
        run: make gen

      - name: Prepare Warden data for E2E
        run: cp fixtures/warden/data.json build/image/data.json

      - name: Start services
        run: docker compose -f "$COMPOSE_FILE" up -d

      - name: Wait for services to be ready
        run: |
          start=$(date +%s)
          while true; do
            all_ok=true
            for endpoint in "8080/healthz" "8081/healthcheck" "8082/healthz"; do
              port="${endpoint%%/*}"
              path="${endpoint#*/}"
              if ! curl -sf --connect-timeout 3 "http://127.0.0.1:$port/$path" > /dev/null 2>&1; then
                all_ok=false
                break
              fi
            done
            if [ "$all_ok" = true ]; then
              echo "All services ready."
              break
            fi
            now=$(date +%s)
            elapsed=$(( now - start ))
            if [ "$elapsed" -ge "${TEST_WAIT_TIMEOUT:-180}" ]; then
              echo "Services did not become ready within ${TEST_WAIT_TIMEOUT}s."
              docker compose -f "$COMPOSE_FILE" ps -a
              docker compose -f "$COMPOSE_FILE" logs --tail=200
              exit 1
            fi
            echo "  waiting... (${elapsed}s)"
            sleep 2
          done

      - name: Run smoke E2E
        run: go test -race -timeout 15m ./e2e/...

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" ps -a
          docker compose -f "$COMPOSE_FILE" logs --tail=300

  # CLI/binary build check on the changed-code path only.
  build:
    name: Build check (CLI)
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download dependencies
        run: go mod download

      - name: Build project
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o stargate-suite ./cmd/suite
