name: Release

# Supply-chain-hardened release. Triggered by a semver tag push or a controlled
# workflow_dispatch re-run. All third-party actions are pinned to a full commit
# SHA (comment keeps the semantic version). Default permissions are read-only;
# only this job elevates. Produces signed, attested, SBOM-bearing artifacts.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.10.0'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create GitHub Release + upload assets
      packages: write        # push image to GHCR
      id-token: write        # keyless Cosign signing / attestation (OIDC)
      attestations: write    # GitHub artifact attestations

    steps:
      - name: Resolve release ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*.*.*) ;;
            *) echo "Refusing to release non-semver tag: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag commit is on main
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          COMMIT=$(git rev-list -n 1 "$TAG")
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Tag $TAG ($COMMIT) is not an ancestor of origin/main; refusing to release."
            exit 1
          fi

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Lint + vulnerability + tests gate
        run: |
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          pkgs=$(go list ./... | grep -v '/e2e$' || true)
          if [ -n "$pkgs" ]; then go test -race $pkgs; fi

      - name: Extract version information
        id: version
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          VERSION=${TAG#v}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          # Pre-release tags (e.g. v0.10.0-rc.1) must NOT update `latest` (R-01).
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## / {
                if (found) exit
                # Match "## [x.y.z]" or "## x.y.z"
                line=$0
                gsub(/[][]/, "", line)
                if (index(line, ver)) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG entry found for $VERSION; using generic notes." >> "$NOTES_FILE"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Build multi-platform binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w \
            -X main.Version=${{ steps.version.outputs.version }} \
            -X main.Commit=${{ steps.version.outputs.commit }} \
            -X main.BuildDate=${{ steps.version.outputs.build_date }}"

          for target in \
            "linux amd64" "linux arm64" \
            "darwin amd64" "darwin arm64" \
            "windows amd64" "windows arm64"; do
            set -- $target
            os=$1; arch=$2
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/stargate-suite-$os-$arch$ext" ./cmd/suite
          done

      - name: Generate checksums
        run: |
          cd dist
          # Stable ordering; exclude the manifest itself so `sha256sum -c` stays valid.
          sha256sum $(ls | grep -v '^checksums.txt$' | sort) > checksums.txt

      - name: Generate SBOM (source + binaries)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` only on stable tags; pre-release tags never move it (R-01).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build image (load for scan, no push yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Build and push image (amd64 + arm64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance for image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance for binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/stargate-suite-*'

      - name: Sign checksums (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*
          name: Release ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
