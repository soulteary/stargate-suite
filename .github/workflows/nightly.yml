name: Nightly

# The main workflow already runs the pinned amd64 E2E suite and Windows/macOS
# CLI builds on every integration-branch push. This scheduled tier is reserved
# for the expensive capability not covered there: a multi-architecture image
# build under QEMU. It remains manually runnable for release preparation.
on:
  schedule:
    # 02:30 UTC every Sunday (off-peak).
    - cron: '30 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  docker-multiarch:
    name: Weekly multi-arch image build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (amd64 + arm64, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
