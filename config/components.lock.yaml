# Component lock — 镜像内容寻址 digest 与 manifest 版本快照。
#
# image/version 由 components.yaml 派生；正式发布时由 release 流程填入
# digest（sha256:...），使部署可复现且可离线校验。开发分支允许 digest 暂留空。
#
# 生成/填充约定（后续 PR / release）：
#   digest 通过 `docker buildx imagetools inspect <image>:<version>` 或
#   `crane digest <image>:<version>` 获取，写入对应 digest 字段。
#   校验时以 image@digest 覆盖 image:version 拉取，确保内容一致。

schemaVersion: 1

images:
  stargate:
    image: ghcr.io/soulteary/stargate
    version: 1.0.0
    digest: ""
  warden:
    image: ghcr.io/soulteary/warden
    version: 1.1.0
    digest: ""
  herald:
    image: ghcr.io/soulteary/herald
    version: 1.1.0
    digest: ""
  herald-totp:
    image: ghcr.io/soulteary/herald-totp
    version: 1.1.0
    digest: ""
  herald-dingtalk:
    image: ghcr.io/soulteary/herald-dingtalk
    version: 1.1.0
    digest: ""
  herald-smtp:
    image: ghcr.io/soulteary/herald-smtp
    version: 1.1.0
    digest: ""
  redis:
    image: redis
    version: 8.4-alpine
    digest: ""
  protected:
    image: ghcr.io/traefik/whoami
    version: v1.11
    digest: ""
