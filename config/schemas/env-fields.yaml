# env-fields schema (PR7): declarative field-type + safety contract for the v1
# config surface. This is the single source that the four-layer validator in
# internal/policy mirrors; the drift test (internal/contract/schema_drift_test.go)
# asserts every code listed here exists as a policy.Code* constant so docs and
# enforcement never diverge.
#
# type     : field shape checked in layer 1 (port|url|bool|duration|cidrlist|hostlist|secret|text)
# minLen   : minimum length for secret-typed fields in strict profiles
# code     : structured finding code emitted when the field is invalid/unsafe
# profiles : profiles in which the SAFETY (layer 2+) rule is enforced as an error
schemaVersion: 1
fields:
  # --- Stargate v1.0.0 ---
  COOKIE_SECURE:
    type: bool
    code: STARGATE_COOKIE_SECURE_REQUIRED
    profiles: [production]
  CALLBACK_ALLOWED_HOSTS:
    type: hostlist
    code: STARGATE_CALLBACK_ALLOWED_HOSTS_INVALID
  SESSION_EXCHANGE_SECRET:
    type: secret
    minLen: 32
    code: STARGATE_SESSION_EXCHANGE_SECRET_REQUIRED
    profiles: [production]
  TRUSTED_PROXIES:
    type: cidrlist
    code: STARGATE_TRUSTED_PROXIES_INVALID_CIDR
  STEP_UP_PATHS:
    type: text
    code: STARGATE_STEP_UP_PATHS_REQUIRED
  PASSWORD_HEADER_AUTH_ENABLED:
    type: bool
    code: FIELD_BOOL_INVALID
  # --- Herald v1.1.0 ---
  REQUEST_AUTH_MODE:
    type: text
    code: CROSS_SERVICE_AUTH_MODE_MISMATCH
    profiles: [test, production]
  HMAC_MAX_DRIFT:
    type: duration
    code: HERALD_HMAC_MAX_DRIFT_INVALID
  HMAC_V1_ENABLED:
    type: bool
    code: HMAC_V1_FORBIDDEN
    profiles: [development, test, production]
  HERALD_IDEMPOTENCY_SECRET:
    type: secret
    minLen: 32
    code: HERALD_IDEMPOTENCY_SECRET_WEAK
    profiles: [production]
  HERALD_PII_PEPPER:
    type: secret
    minLen: 32
    code: HERALD_PII_PEPPER_WEAK
    profiles: [production]
  HERALD_TRUSTED_PROXIES:
    type: cidrlist
    code: STARGATE_TRUSTED_PROXIES_INVALID_CIDR
  HERALD_TEST_MODE:
    type: bool
    code: HERALD_TEST_MODE_FORBIDDEN
    profiles: [production]
